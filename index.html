<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diana & Richard - Wedding Invitation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --blush-pink: #f8ecee;
            --dusty-rose: #d8a7b1;
            --deep-rose: #b57c88;
            --gold: #d4af37;
            --dark-text: #4a3e3d;
            --light-bg: #fdfbfb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1a1a;
            font-family: 'Cormorant Garamond', serif;
            color: var(--dark-text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Mobile Viewport Container */
        .phone-frame {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 880px;
            background-color: var(--light-bg);
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            scroll-behavior: smooth;
        }

        /* Hide scrollbars */
        .phone-frame::-webkit-scrollbar {
            display: none;
        }
        .phone-frame {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* ENVELOPE OVERLAY */
        .envelope-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #e8d3d8;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.8s ease;
        }

        .envelope-wrapper.open {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }

        .envelope {
            width: 85%;
            height: 380px;
            background: #f1dadf;
            border-radius: 8px;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 40px;
            text-align: center;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 178px solid transparent;
            border-right: 178px solid transparent;
            border-top: 180px solid #e2c2c9;
            transform-origin: top;
            transition: transform 0.6s ease;
        }

        .wax-seal {
            position: absolute;
            top: 140px;
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, #d4af37, #aa820a);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-family: 'Alex Brush', cursive;
            font-size: 26px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            cursor: pointer;
            z-index: 10;
            border: 2px solid #f9ebbe;
            transition: transform 0.2s ease;
        }

        .wax-seal:hover {
            transform: scale(1.05);
        }

        .envelope-text {
            font-family: 'Alex Brush', cursive;
            font-size: 28px;
            color: #7a5860;
            padding: 0 20px;
        }

        /* CARD SECTIONS */
        .section {
            padding: 40px 24px;
            text-align: center;
            position: relative;
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            background: linear-gradient(180deg, rgba(248,236,238,0.6) 0%, rgba(253,251,251,1) 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 50px 20px;
        }

        .monogram-crest {
            width: 70px;
            height: 70px;
            border: 1px solid var(--dusty-rose);
            border-radius: 50%;
            margin: 0 auto 15px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Alex Brush', cursive;
            font-size: 30px;
            color: var(--deep-rose);
        }

        .subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #8c7378;
            margin-bottom: 12px;
        }

        .couple-names {
            font-family: 'Alex Brush', cursive;
            font-size: 48px;
            color: var(--deep-rose);
            line-height: 1.1;
            margin-bottom: 20px;
        }

        /* Embedded Illustration Container */
        .illustration-card {
            width: 100%;
            height: 200px;
            background-color: #fceef0;
            border-radius: 120px 120px 0 0;
            border: 1px solid var(--dusty-rose);
            margin: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .date-box {
            border-top: 1px solid var(--dusty-rose);
            border-bottom: 1px solid var(--dusty-rose);
            padding: 15px 0;
            width: 100%;
            margin: 15px 0;
        }

        .date-main {
            font-size: 32px;
            letter-spacing: 2px;
            font-weight: 600;
            color: var(--dark-text);
        }

        .venue-title {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .venue-sub {
            font-size: 14px;
            font-style: italic;
            color: #6e5c5f;
        }

        /* Countdown Section */
        .countdown-section {
            background-color: var(--blush-pink);
            border-radius: 12px;
            margin: 20px;
            padding: 30px 20px;
        }

        .timer-grid {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .time-box {
            background: #fff;
            padding: 12px 8px;
            border-radius: 8px;
            min-width: 65px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .time-number {
            font-size: 22px;
            font-weight: 600;
            color: var(--deep-rose);
        }

        .time-label {
            font-family: 'Montserrat', sans-serif;
            font-size: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8c7378;
        }

        /* Schedule Section */
        .timeline {
            margin-top: 25px;
            position: relative;
            text-align: left;
            padding-left: 20px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 0;
            top: 5px;
            bottom: 5px;
            width: 1px;
            background-color: var(--dusty-rose);
        }

        .timeline-item {
            position: relative;
            margin-bottom: 25px;
            padding-left: 15px;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -20px;
            top: 6px;
            width: 7px;
            height: 7px;
            background-color: var(--deep-rose);
            border-radius: 50%;
        }

        .timeline-time {
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            color: var(--deep-rose);
            font-weight: 500;
        }

        .timeline-title {
            font-size: 18px;
            font-weight: 600;
        }

        /* RSVP Section */
        .rsvp-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .rsvp-input, .rsvp-select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--dusty-rose);
            border-radius: 6px;
            background-color: #fff;
            font-family: 'Cormorant Garamond', serif;
            font-size: 16px;
            outline: none;
        }

        .rsvp-button {
            background-color: var(--deep-rose);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .rsvp-button:hover {
            background-color: #985f6a;
        }
    </style>
</head>
<body>

        <!-- HERO SECTION -->
        <section class="section hero">

                <div class="monogram-crest">D&R</div>

                <h1 class="couple-names">Diana & Richard</h1>

                    <path d="M90 120 V95 A10 10 0 0 1 110 95 V120 Z" fill="#e8d3d8" stroke="#b57c88" stroke-width="1.5"/>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic Burgundy Embossed Laurel Envelope</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0c0a0b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Cinzel', serif;
            overflow: hidden;
        }

        .viewport {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 800px;
            position: relative;
            background-color: #fff;
            overflow: hidden;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.95);
            border-radius: 16px;
        }

        /* Revealed Card (Inside) */
        .card-content {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fffef9;
            z-index: 5;
            color: #4d0c17;
            text-align: center;
        }
        .card-content h2 { font-size: 24px; font-weight: 700; letter-spacing: 2px; }

        /* ENVELOPE BASE CONTAINER */
        .envelope-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background-color: #2e080f; /* Deep Burgundy Base */
            perspective: 1200px;
            pointer-events: auto;
            transition: opacity 0.8s ease 0.8s, visibility 0.8s ease 0.8s;
        }

        .envelope-container.open {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* DIAGONAL OVERLAPPING FLAPS */
        .flap-svg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            transition: transform 1.2s cubic-bezier(0.23, 1, 0.32, 1);
            will-change: transform;
        }

        .flap-left-container {
            z-index: 5;
            transform-origin: left center;
        }

        .flap-right-container {
            z-index: 4;
            transform-origin: right center;
        }

        .envelope-container.open .flap-left-container {
            transform: rotateY(-165deg);
        }

        .envelope-container.open .flap-right-container {
            transform: rotateY(165deg);
        }

        /* CREAM WAX SEAL WITH "SM" */
        .wax-seal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 110px;
            height: 110px;
            background: radial-gradient(circle at 35% 30%, #ffffff 0%, #f7f1e3 40%, #e2d3bb 75%, #b29e80 100%);
            border-radius: 46% 54% 48% 52% / 53% 47% 53% 47%;
            box-shadow: 
                0 16px 36px rgba(0, 0, 0, 0.85),
                inset 0 4px 6px rgba(255, 255, 255, 1),
                inset 0 -5px 8px rgba(100, 85, 65, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 20;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease;
        }

        .wax-seal:hover {
            transform: translate(-50%, -50%) scale(1.06);
            box-shadow: 0 20px 42px rgba(0, 0, 0, 0.95);
        }

        .envelope-container.open .wax-seal {
            transform: translate(-50%, -50%) scale(0.6);
            opacity: 0;
        }

        .wax-seal-inner {
            width: 82px;
            height: 82px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, #faf6ee 0%, #ebe0cd 80%, #caa486 100%);
            border: 1px solid rgba(180, 160, 135, 0.45);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.25), 0 1px 2px rgba(255, 255, 255, 0.8);
        }

        .monogram-sm {
            font-family: 'Great Vibes', cursive;
            font-size: 42px;
            color: #6b5840;
            text-shadow: 1px 1px 0px rgba(255, 255, 255, 0.9), -1px -1px 1px rgba(0, 0, 0, 0.3);
            letter-spacing: -2px;
            margin-top: -4px;
        }
    </style>
</head>
<body>

    <div class="viewport">
        
        <!-- Inside Card (Hidden) -->
        <div class="card-content">
            <h2>STEP 1 COMPLETE</h2>
        </div>

        <!-- BURGUNDY ENVELOPE -->
        <div class="envelope-container" id="envelope">

            <!-- PHOTOREALISTIC EMBOSSING SHADOW FILTERS -->
            <svg style="display: none;">
                <defs>
                    <!-- Paper Surface Structure Filter (Noise/Grain) -->
                    <filter id="paperStructure" x="0%" y="0%" width="100%" height="100%">
                        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
                        <feColorMatrix type="matrix" values="0 0 0 0 0.2  0 0 0 0 0.2  0 0 0 0 0.2  0 0 0 -1.2 1.1"/>
                        <feComposite operator="in" in2="SourceGraphic"/>
                    </filter>

                    <!-- Real embossed relief Filter (Highlights & Shadows) -->
                    <filter id="realEmboss" x="-10%" y="-10%" width="130%" height="130%">
                        <feGaussianBlur in="SourceAlpha" stdDeviation="0.8" result="blur"/>
                        <feSpecularLighting in="blur" surfaceScale="10" specularConstant="1.2" specularExponent="20" lighting-color="#ffffff" result="spec1">
                            <feDistantLight azimuth="45" elevation="60"/>
                        </feSpecularLighting>
                        <feSpecularLighting in="blur" surfaceScale="10" specularConstant="0.8" specularExponent="10" lighting-color="#ffffff" result="spec2">
                            <feDistantLight azimuth="225" elevation="60"/>
                        </feSpecularLighting>
                        <feComposite in="spec1" in2="SourceAlpha" operator="in" result="spec1Final"/>
                        <feComposite in="spec2" in2="SourceAlpha" operator="in" result="spec2Final"/>
                        <feMerge>
                            <feMergeNode in="SourceGraphic"/>
                            <feMergeNode in="spec1Final"/>
                            <feMergeNode in="spec2Final"/>
                        </feMerge>
                    </filter>

                    <!-- Tone-on-tone Embossed Laurel Pattern Definition -->
                    <g id="laurel-branch" fill="#4d0c17" opacity="0.9">
                        <path d="M 0,200 Q 50,120 120,0 Q 190,120 240,200"/>
                        <circle cx="0" cy="180" r="10"/> <circle cx="20" cy="160" r="11"/> <circle cx="40" cy="140" r="12"/>
                        <circle cx="65" cy="115" r="13"/> <circle cx="90" cy="90" r="14"/> <circle cx="120" cy="0" r="15"/>
                        <circle cx="150" cy="90" r="14"/> <circle cx="175" cy="115" r="13"/> <circle cx="200" cy="140" r="12"/>
                        <circle cx="220" cy="160" r="11"/> <circle cx="240" cy="180" r="10"/>
                    </g>
                </defs>
            </svg>

            <!-- LEFT DIAGONAL FLAP -->
            <div class="flap-svg flap-left-container">
                <svg width="100%" height="100%" viewBox="0 0 400 800" preserveAspectRatio="none">
                    <defs>
                        <linearGradient id="leftGradReal" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#5c111e"/>
                            <stop offset="100%" stop-color="#210307"/>
                        </linearGradient>
                        <filter id="dropShadowLeft" x="-10%" y="-10%" width="130%" height="120%">
                            <feDropShadow dx="12" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.8"/>
                        </filter>
                    </defs>

                    <!-- Flap Base (Burgundy Paper) -->
                    <path d="M 0,0 L 220,400 L 0,800 Z" fill="url(#leftGradReal)" filter="url(#dropShadowLeft)"/>
                    
                    <!-- Paper Structure Overlay -->
                    <rect x="0" y="0" width="220" height="800" filter="url(#paperStructure)" opacity="0.3" fill="#000"/>

                    <!-- Real Embossed Laurel Pattern -->
                    <use href="#laurel-branch" x="15" y="40" transform="scale(1.1)" filter="url(#realEmboss)"/>
                    <use href="#laurel-branch" x="-10" y="320" transform="scale(1.3) rotate(-15)" filter="url(#realEmboss)"/>
                    <use href="#laurel-branch" x="15" y="580" transform="scale(0.9) rotate(25)" filter="url(#realEmboss)"/>
                </svg>
            </div>

            <!-- RIGHT DIAGONAL FLAP -->
            <div class="flap-svg flap-right-container">
                <svg width="100%" height="100%" viewBox="0 0 400 800" preserveAspectRatio="none">
                    <defs>
                        <linearGradient id="rightGradReal" x1="100%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#5c111e"/>
                            <stop offset="100%" stop-color="#210307"/>
                        </linearGradient>
                        <filter id="dropShadowRight" x="-20%" y="-10%" width="130%" height="120%">
                            <feDropShadow dx="-12" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.8"/>
                        </filter>
                    </defs>

                    <!-- Flap Base (Burgundy Paper) -->
                    <path d="M 400,0 L 180,400 L 400,800 Z" fill="url(#rightGradReal)" filter="url(#dropShadowRight)"/>

                    <!-- Paper Structure Overlay -->
                    <rect x="180" y="0" width="220" height="800" filter="url(#paperStructure)" opacity="0.3" fill="#000"/>

                    <!-- Real Embossed Laurel Pattern -->
                    <use href="#laurel-branch" x="180" y="40" transform="scale(-1.1, 1.1) translate(-400, 0)" filter="url(#realEmboss)"/>
                    <use href="#laurel-branch" x="150" y="350" transform="scale(-1.3, 1.3) translate(-350, 0) rotate(15)" filter="url(#realEmboss)"/>
                    <use href="#laurel-branch" x="170" y="600" transform="scale(-0.9, 0.9) translate(-400, 0) rotate(-20)" filter="url(#realEmboss)"/>
                </svg>
            </div>

            <!-- WAX SEAL WITH "SM" -->
            <div class="wax-seal" onclick="openEnvelope()">
                <div class="wax-seal-inner">
                    <span class="monogram-sm">SM</span>
                </div>
            </div>
        </div>

    </div>

    <script>
        function openEnvelope() {
            document.getElementById('envelope').classList.add('open');
        }
    </script>
</body>
</html>

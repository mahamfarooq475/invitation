<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic Burgundy Embossed Laurel Envelope</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0c0a0b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Cinzel', serif;
            overflow: hidden;
        }

        .viewport {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 800px;
            position: relative;
            background-color: #fff;
            overflow: hidden;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.95);
            border-radius: 16px;
        }

        /* Revealed Card (Inside) */
        .card-content {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fffef9;
            z-index: 5;
            color: #4d0c17;
            text-align: center;
        }
        .card-content h2 { font-size: 24px; font-weight: 700; letter-spacing: 2px; }

        /* ENVELOPE BASE CONTAINER */
        .envelope-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background-color: #2e080f; /* Deep Burgundy Base */
            perspective: 1200px;
            pointer-events: auto;
            transition: opacity 0.8s ease 0.8s, visibility 0.8s ease 0.8s;
        }

        .envelope-container.open {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* DIAGONAL OVERLAPPING FLAPS */
        .flap-svg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            transition: transform 1.2s cubic-bezier(0.23, 1, 0.32, 1);
            will-change: transform;
        }

        .flap-left-container {
            z-index: 5;
            transform-origin: left center;
        }

        .flap-right-container {
            z-index: 4;
            transform-origin: right center;
        }

        .envelope-container.open .flap-left-container {
            transform: rotateY(-165deg);
        }

        .envelope-container.open .flap-right-container {
            transform: rotateY(165deg);
        }

        /* CREAM WAX SEAL WITH "SM" */
        .wax-seal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 110px;
            height: 110px;
            background: radial-gradient(circle at 35% 30%, #ffffff 0%, #f7f1e3 40%, #e2d3bb 75%, #b29e80 100%);
            border-radius: 46% 54% 48% 52% / 53% 47% 53% 47%;
            box-shadow: 
                0 16px 36px rgba(0, 0, 0, 0.85),
                inset 0 4px 6px rgba(255, 255, 255, 1),
                inset 0 -5px 8px rgba(100, 85, 65, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 20;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease;
        }

        .wax-seal:hover {
            transform: translate(-50%, -50%) scale(1.06);
            box-shadow: 0 20px 42px rgba(0, 0, 0, 0.95);
        }

        .envelope-container.open .wax-seal {
            transform: translate(-50%, -50%) scale(0.6);
            opacity: 0;
        }

            width: 82px;
            height: 82px;
            border-radius: 50%;

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olive Green Butterfly Envelope</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121512;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: sans-serif;
            overflow: hidden;
        }

        /* Mobile Frame Screen */
        .viewport {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 800px;
            position: relative;
            background-color: #f4efe6;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            border-radius: 12px;
        }

        /* ENVELOPE BASE */
        .envelope-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #4a5043;
            /* Embossed Leaf Pattern Background */
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(255,255,255,0.06) 2px, transparent 40px),
                radial-gradient(circle at 80% 70%, rgba(255,255,255,0.06) 2px, transparent 40px);
            z-index: 10;
            transition: transform 1s ease-in-out, opacity 0.8s ease;
        }

        .envelope-container.open {
            transform: scale(1.1);
            opacity: 0;
            pointer-events: none;
        }

        /* EMBOSSED LEAF PATTERN OVERLAY */
        .leaf-pattern {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.25;
            pointer-events: none;
        }

        /* LEFT & RIGHT TRIANGULAR FLAPS */
        .flap-left {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-top: 400px solid transparent;
            border-bottom: 400px solid transparent;
            border-left: 210px solid #3f4538;
            filter: drop-shadow(4px 0px 8px rgba(0, 0, 0, 0.35));
            transition: transform 0.8s ease-in-out;
            transform-origin: left;
        }

        .flap-right {
            position: absolute;
            top: 0;
            right: 0;
            width: 0;
            height: 0;
            border-top: 400px solid transparent;
            border-bottom: 400px solid transparent;
            border-right: 210px solid #454b3d;
            filter: drop-shadow(-4px 0px 8px rgba(0, 0, 0, 0.35));
            transition: transform 0.8s ease-in-out;
            transform-origin: right;
        }

        .envelope-container.open .flap-left {
            transform: rotateY(-120deg);
        }

        .envelope-container.open .flap-right {
            transform: rotateY(120deg);
        }

        /* GOLD BUTTERFLY WAX SEAL */
        .wax-seal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90px;
            height: 90px;
            background: radial-gradient(circle at 35% 35%, #e8c76b, #b38728 60%, #7d5910 100%);
            border-radius: 50%;
            box-shadow: 
                0 6px 15px rgba(0, 0, 0, 0.4),
                inset 0 2px 4px rgba(255, 255, 255, 0.5),
                inset 0 -3px 6px rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 20;
            border: 3px solid #a67c1e;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .wax-seal:hover {
            transform: translate(-50%, -50%) scale(1.06);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }

        .wax-seal::before {
            content: '';
            position: absolute;
            width: 78px;
            height: 78px;
            border-radius: 50%;
            border: 1.5px dashed rgba(255, 255, 255, 0.35);
        }

        /* BUTTERFLY & LAUREL SVG */
        .seal-icon {
            width: 55px;
            height: 55px;
            fill: #523b0a;
            filter: drop-shadow(1px 1px 1px rgba(255, 255, 255, 0.3));
        }

        /* PLACEHOLDER INSIDE CARD (REVEALED ON CLICK) */
        .card-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            color: #3b4035;
        }

        .card-content h2 {
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 300;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="viewport">
        <!-- CARD CONTENT HIDDEN BEHIND ENVELOPE -->
        <div class="card-content">
            <h2>STEP 1 COMPLETE</h2>
            <p>Ready for Step 2!</p>
        </div>

        <!-- OLIVE GREEN ENVELOPE -->
        <div class="envelope-container" id="envelope">
            <!-- EMBOSSED LEAF PATTERNS -->
            <svg class="leaf-pattern" viewBox="0 0 100 100" preserveAspectRatio="none">
                <path d="M10,20 Q30,10 50,30 T90,20" stroke="white" stroke-width="0.5" fill="none"/>
                <path d="M5,70 Q25,60 45,80 T85,70" stroke="white" stroke-width="0.5" fill="none"/>
            </svg>

            <div class="flap-left"></div>
            <div class="flap-right"></div>

            <!-- BUTTERFLY WAX SEAL -->
            <div class="wax-seal" onclick="openEnvelope()">
                <svg class="seal-icon" viewBox="0 0 24 24">
                    <!-- Laurel Wreath -->
                    <path d="M6 15C5 12 6 8 8 6M18 15C19 12 18 8 16 6" stroke="#523b0a" stroke-width="1" fill="none"/>
                    <!-- Butterfly -->
                    <path d="M12 9 C11 7, 7 5, 6 9 C5 12, 9 14, 12 11 M12 9 C13 7, 17 5, 18 9 C19 12, 15 14, 12 11 M12 11 C10 13, 8 17, 11 18 C13 18, 12 14, 12 11 M12 11 C14 13, 16 17, 13 18 C11 18, 12 14, 12 11 M12 7 V15"/>
                </svg>
            </div>
        </div>
    </div>

    <script>
        function openEnvelope() {
            document.getElementById('envelope').classList.add('open');
        }
    </script>
</body>
</html>

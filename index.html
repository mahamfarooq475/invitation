<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olive Green Butterfly Envelope</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f120e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Georgia', serif;
            overflow: hidden;
        }

        .viewport {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 800px;
            position: relative;
            background-color: #f7f3ed;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
            border-radius: 14px;
        }

        /* ENVELOPE BASE */
        .envelope-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #4b5242;
            z-index: 10;
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.8s ease;
        }

        .envelope-container.open {
            transform: scale(1.08);
            opacity: 0;
            pointer-events: none;
        }

        /* REALISTIC PAPER GRAIN OVERLAY */
        .paper-texture {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            opacity: 0.35;
            background-image: radial-gradient(#000 0.75px, transparent 0.75px), radial-gradient(#fff 0.75px, #4b5242 0.75px);
            background-size: 3px 3px;
            background-position: 0 0, 1.5px 1.5px;
            mix-blend-mode: overlay;
        }

        /* EMBOSSED LEAF PATTERNS */
        .leaf-emboss-left, .leaf-emboss-right {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
            opacity: 0.18;
            mix-blend-mode: overlay;
        }

        .leaf-emboss-left { left: 0; }
        .leaf-emboss-right { right: 0; transform: scaleX(-1); }

        /* LEFT & RIGHT TRIANGULAR FLAPS */
        .flap-left {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-top: 400px solid transparent;
            border-bottom: 400px solid transparent;
            border-left: 208px solid #42493a;
            filter: drop-shadow(6px 0px 12px rgba(0, 0, 0, 0.45));
            transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: left;
            z-index: 2;
        }

        .flap-right {
            position: absolute;
            top: 0;
            right: 0;
            width: 0;
            height: 0;
            border-top: 400px solid transparent;
            border-bottom: 400px solid transparent;
            border-right: 208px solid #4a5141;
            filter: drop-shadow(-6px 0px 12px rgba(0, 0, 0, 0.45));
            transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: right;
            z-index: 2;
        }

        .envelope-container.open .flap-left {
            transform: rotateY(-110deg);
        }

        .envelope-container.open .flap-right {
            transform: rotateY(110deg);
        }

        /* REALISTIC METALLIC BUTTERFLY WAX SEAL */
        .wax-seal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 92px;
            height: 92px;
            background: radial-gradient(circle at 30% 30%, #f3d683 0%, #c99c32 45%, #7a5813 85%, #473205 100%);
            border-radius: 50%;
            box-shadow: 
                0 8px 20px rgba(0, 0, 0, 0.5),
                inset 0 3px 6px rgba(255, 255, 255, 0.6),
                inset 0 -4px 8px rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 20;
            border: 1px solid #dcb04d;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .wax-seal:hover {
            transform: translate(-50%, -50%) scale(1.05);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
        }

        .wax-seal-inner {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            border: 1.5px dashed rgba(255, 240, 190, 0.45);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .seal-icon {
            width: 52px;
            height: 52px;
            fill: #422f07;
            filter: drop-shadow(1px 1px 0px rgba(255, 235, 170, 0.4));
        }

        /* CARD CONTENT BELOW */
        .card-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            color: #3b4035;
        }

        .card-content h2 {
            font-size: 24px;
            letter-spacing: 2px;
            font-weight: 400;
        }
    </style>
</head>
<body>

    <div class="viewport">
        <!-- CARD CONTENT HIDDEN BEHIND ENVELOPE -->
        <div class="card-content">
            <h2>STEP 1 COMPLETE</h2>
            <p style="margin-top: 10px; font-size: 14px; color: #7a8270;">Ready for Step 2!</p>
        </div>

        <!-- TEXTURED OLIVE ENVELOPE -->
        <div class="envelope-container" id="envelope">
            <div class="paper-texture"></div>

            <!-- EMBOSSED BOTANICAL BRANCHES -->
            <svg class="leaf-emboss-left" viewBox="0 0 100 200">
                <path d="M 10,10 Q 30,50 15,100 T 20,190" stroke="#ffffff" stroke-width="2" fill="none"/>
                <path d="M 15,40 Q 35,30 40,45 Q 25,50 15,40 Z" fill="#ffffff"/>
                <path d="M 17,70 Q 40,65 42,80 Q 25,85 17,70 Z" fill="#ffffff"/>
                <path d="M 18,110 Q 38,100 45,120 Q 28,122 18,110 Z" fill="#ffffff"/>
            </svg>
            <svg class="leaf-emboss-right" viewBox="0 0 100 200">
                <path d="M 10,10 Q 30,50 15,100 T 20,190" stroke="#ffffff" stroke-width="2" fill="none"/>
                <path d="M 15,40 Q 35,30 40,45 Q 25,50 15,40 Z" fill="#ffffff"/>
                <path d="M 17,70 Q 40,65 42,80 Q 25,85 17,70 Z" fill="#ffffff"/>
                <path d="M 18,110 Q 38,100 45,120 Q 28,122 18,110 Z" fill="#ffffff"/>
            </svg>

            <div class="flap-left"></div>
            <div class="flap-right"></div>

            <!-- WAX SEAL -->
            <div class="wax-seal" onclick="openEnvelope()">
                <div class="wax-seal-inner">
                    <svg class="seal-icon" viewBox="0 0 24 24">
                        <path d="M6 15C5 12 6 8 8 6M18 15C19 12 18 8 16 6" stroke="#422f07" stroke-width="1.2" fill="none"/>
                        <path d="M12 9 C11 7, 7 5, 6 9 C5 12, 9 14, 12 11 M12 9 C13 7, 17 5, 18 9 C19 12, 15 14, 12 11 M12 11 C10 13, 8 17, 11 18 C13 18, 12 14, 12 11 M12 11 C14 13, 16 17, 13 18 C11 18, 12 14, 12 11 M12 7 V15"/>
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <script>
        function openEnvelope() {
            document.getElementById('envelope').classList.add('open');
        }
    </script>
</body>
</html>

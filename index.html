<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olive Embossed Leaf Envelope - Step 1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0c0f0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Cinzel', serif;
            overflow: hidden;
        }

        .viewport {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 800px;
            position: relative;
            background-color: #f7f3ed;
            overflow: hidden;
            box-shadow: 0 35px 80px rgba(0, 0, 0, 0.95);
            border-radius: 14px;
        }

        /* REVEALED CARD INSIDE */
        .card-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            color: #2e3b26;
            background: radial-gradient(circle at center, #fffefb 0%, #f1efe6 100%);
            transform: scale(0.95) translateY(20px);
            opacity: 0;
            transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1), opacity 1s ease 0.3s;
        }

        .envelope-container.open ~ .card-content {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        .card-content h2 {
            font-size: 26px;
            letter-spacing: 3px;
            font-weight: 700;
        }

        /* ENVELOPE BASE */
        .envelope-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #4a5440;
            z-index: 10;
            perspective: 1200px;
            pointer-events: auto;
            transition: opacity 0.8s ease 0.6s, visibility 0.8s ease 0.6s;
        }

        .envelope-container.open {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* FINE FINE TEXTURED PAPER GRAIN */
        .paper-grain {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 8;
            pointer-events: none;
            opacity: 0.22;
            background-image: radial-gradient(#ffffff 0.8px, transparent 0.8px), radial-gradient(#000000 0.8px, transparent 0.8px);
            background-size: 4px 4px;
            mix-blend-mode: overlay;
        }

        /* ENVELOPE FLAPS (LEFT & RIGHT DIAGONAL) */
        .flap-svg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            transition: transform 1.1s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
        }

        .flap-left-container {
            z-index: 5;
            transform-origin: left center;
        }

        .flap-right-container {
            z-index: 4;
            transform-origin: right center;
        }

        .envelope-container.open .flap-left-container {
            transform: rotateY(-160deg);
        }

        .envelope-container.open .flap-right-container {
            transform: rotateY(160deg);
        }

        /* CREAM & GOLD WAX SEAL WITH "SM" MONOGRAM */
        .wax-seal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 110px;
            height: 110px;
            background: radial-gradient(circle at 35% 30%, #ffffff 0%, #f7f1e3 40%, #e2d3bb 75%, #b29e80 100%);
            border-radius: 45% 55% 48% 52% / 53% 47% 53% 47%;
            box-shadow: 
                0 14px 30px rgba(0, 0, 0, 0.85),
                inset 0 4px 6px rgba(255, 255, 255, 1),
                inset 0 -5px 8px rgba(100, 85, 65, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 20;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease;
            will-change: transform, opacity;
        }

        .wax-seal:hover {
            transform: translate(-50%, -50%) scale(1.06);
            box-shadow: 0 18px 36px rgba(0, 0, 0, 0.95);
        }

        .envelope-container.open .wax-seal {
            transform: translate(-50%, -50%) scale(0.6);
            opacity: 0;
        }

        .wax-seal-inner {
            width: 82px;
            height: 82px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, #faf6ee 0%, #ebe0cd 80%, #caa486 100%);
            border: 1px solid rgba(180, 160, 135, 0.45);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 
                inset 0 3px 6px rgba(0, 0, 0, 0.25),
                0 1px 2px rgba(255, 255, 255, 0.8);
        }

        .monogram-sm {
            font-family: 'Great Vibes', cursive;
            font-size: 42px;
            color: #6b5840;
            text-shadow: 
                1px 1px 0px rgba(255, 255, 255, 0.9),
                -1px -1px 1px rgba(0, 0, 0, 0.3);
            letter-spacing: -2px;
            user-select: none;
            margin-top: -4px;
        }
    </style>
</head>
<body>

    <div class="viewport">
        
        <!-- OLIVE GREEN EMBOSSED LEAF ENVELOPE -->
        <div class="envelope-container" id="envelope">
            <div class="paper-grain"></div>

            <!-- EMBOSSED LEAF BRANCH SVG PATTERN DEFINITION -->
            <svg style="display: none;">
                <defs>
                    <!-- Embossed Gold Leaf Branch Symbol -->
                    <g id="leaf-branch">
                        <!-- Main Stem -->
                        <path d="M 0,200 Q 50,120 120,0" stroke="#bda570" stroke-width="2.5" fill="none" 
                              filter="drop-shadow(1px 1px 1px rgba(0,0,0,0.6))"/>
                        <!-- Leaves with Inner Vein Lines -->
                        <g fill="#a38c58" stroke="#685630" stroke-width="0.8">
                            <!-- Leaf 1 -->
                            <path d="M 20,170 Q 5,150 30,140 Q 40,165 20,170 Z"/>
                            <!-- Leaf 2 -->
                            <path d="M 40,140 Q 60,120 70,145 Q 45,160 40,140 Z"/>
                            <!-- Leaf 3 -->
                            <path d="M 55,110 Q 35,90 65,85 Q 75,105 55,110 Z"/>
                            <!-- Leaf 4 -->
                            <path d="M 75,80 Q 95,60 105,85 Q 85,100 75,80 Z"/>
                            <!-- Leaf 5 -->
                            <path d="M 95,50 Q 80,25 110,20 Q 115,45 95,50 Z"/>
                            <!-- Top Tip Leaf -->
                            <path d="M 120,0 Q 130,-25 140,-5 Q 135,15 120,0 Z"/>
                        </g>
                    </g>
                </defs>
            </svg>

            <!-- LEFT DIAGONAL FLAP -->
            <div class="flap-svg flap-left-container">
                <svg width="100%" height="100%" viewBox="0 0 400 800" preserveAspectRatio="none">
                    <defs>
                        <linearGradient id="leftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#56614b"/>
                            <stop offset="100%" stop-color="#3c4434"/>
                        </linearGradient>
                        <filter id="shadowLeft" x="-10%" y="-10%" width="130%" height="120%">
                            <feDropShadow dx="8" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
                        </filter>
                    </defs>

                    <!-- Flap Shape -->
                    <path d="M 0,0 L 220,400 L 0,800 Z" fill="url(#leftGrad)" filter="url(#shadowLeft)"/>

                    <!-- Embossed Branch Motifs on Left Flap -->
                    <use href="#leaf-branch" x="10" y="50" transform="scale(1.2)"/>
                    <use href="#leaf-branch" x="-30" y="380" transform="scale(1.4) rotate(-20)"/>
                </svg>
            </div>

            <!-- RIGHT DIAGONAL FLAP -->
            <div class="flap-svg flap-right-container">
                <svg width="100%" height="100%" viewBox="0 0 400 800" preserveAspectRatio="none">
                    <defs>
                        <linearGradient id="rightGrad" x1="100%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#505b45"/>
                            <stop offset="100%" stop-color="#343c2d"/>
                        </linearGradient>
                        <filter id="shadowRight" x="-20%" y="-10%" width="130%" height="120%">
                            <feDropShadow dx="-8" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
                        </filter>
                    </defs>

                    <!-- Flap Shape -->
                    <path d="M 400,0 L 180,400 L 400,800 Z" fill="url(#rightGrad)" filter="url(#shadowRight)"/>

                    <!-- Embossed Branch Motifs on Right Flap -->
                    <use href="#leaf-branch" x="180" y="80" transform="scale(-1, 1) translate(-400, 0)"/>
                    <use href="#leaf-branch" x="160" y="420" transform="scale(-1.3, 1.3) translate(-350, 0) rotate(15)"/>
                </svg>
            </div>

            <!-- WAX SEAL -->
            <div class="wax-seal" onclick="openEnvelope()">
                <div class="wax-seal-inner">
                    <span class="monogram-sm">SM</span>
                </div>
            </div>
        </div>

        <!-- REVEALED CARD -->
        <div class="card-content">
            <h2>STEP 1 COMPLETE</h2>
            <p style="margin-top: 10px; font-size: 13px; color: #4a5440; font-family: sans-serif;">Ready for Step 2!</p>
        </div>

    </div>

    <script>
        function openEnvelope() {
            document.getElementById('envelope').classList.add('open');
        }
    </script>
</body>

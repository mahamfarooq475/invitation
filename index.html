<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burgundy Damask Envelope - Smooth Animation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050304;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Cinzel', serif;
            overflow: hidden;
        }

        .viewport {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 800px;
            position: relative;
            background-color: #f7f3ed;
            overflow: hidden;
            box-shadow: 0 35px 80px rgba(0, 0, 0, 0.95);
            border-radius: 14px;
        }

        /* INNER CARD BEHIND ENVELOPE */
        .card-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            color: #4a0e17;
            background: radial-gradient(circle at center, #fffefb 0%, #f3ece1 100%);
            transform: scale(0.95) translateY(20px);
            opacity: 0;
            transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1), opacity 1s ease 0.3s;
        }

        .envelope-container.open ~ .card-content {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        .card-content h2 {
            font-size: 26px;
            letter-spacing: 3px;
            font-weight: 700;
        }

        /* ENVELOPE BASE */
        .envelope-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #3b0a12;
            z-index: 10;
            perspective: 1200px;
            pointer-events: auto;
            transition: opacity 0.8s ease 0.6s, visibility 0.8s ease 0.6s;
        }

        .envelope-container.open {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* PAPER GRAIN OVERLAY */
        .paper-grain {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 8;
            pointer-events: none;
            opacity: 0.18;
            background-image: radial-gradient(#ffffff 0.8px, transparent 0.8px), radial-gradient(#000000 0.8px, transparent 0.8px);
            background-size: 4px 4px;
            mix-blend-mode: overlay;
        }

        /* EMBOSSED DAMASK PATTERN */
        .damask-pattern {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 2;
            opacity: 0.28;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80"><g fill="%23d4af37" fill-opacity="0.8"><path d="M40 0 C30 15, 15 20, 15 35 C15 50, 30 50, 40 70 C50 50, 65 50, 65 35 C65 20, 50 15, 40 0 Z M40 20 C45 27, 52 28, 52 35 C52 42, 44 42, 40 55 C36 42, 28 42, 28 35 C28 28, 35 27, 40 20 Z"/><circle cx="40" cy="35" r="4"/></g></svg>');
            background-size: 80px 80px;
            filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.9));
        }

        /* SMOOTH SCALLOPED FLAPS (SVG) */
        .flap-svg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            transition: transform 1.1s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
        }

        .flap-top-container {
            z-index: 5;
            transform-origin: top center;
        }

        .flap-bottom-container {
            z-index: 4;
            transform-origin: bottom center;
        }

        .envelope-container.open .flap-top-container {
            transform: rotateX(170deg);
        }

        .envelope-container.open .flap-bottom-container {
            transform: rotateX(-170deg);
        }

        /* CREAM SWAN / SM WAX SEAL */
        .wax-seal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 110px;
            height: 110px;
            background: radial-gradient(circle at 35% 30%, #ffffff 0%, #f7f1e3 40%, #e2d3bb 75%, #b29e80 100%);
            border-radius: 45% 55% 48% 52% / 53% 47% 53% 47%;
            box-shadow: 
                0 14px 30px rgba(0, 0, 0, 0.85),
                inset 0 4px 6px rgba(255, 255, 255, 1),
                inset 0 -5px 8px rgba(100, 85, 65, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 20;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease;
            will-change: transform, opacity;
        }

        .wax-seal:hover {
            transform: translate(-50%, -50%) scale(1.06);
            box-shadow: 0 18px 36px rgba(0, 0, 0, 0.95);
        }

        .envelope-container.open .wax-seal {
            transform: translate(-50%, -50%) scale(0.6);
            opacity: 0;
        }

        .wax-seal-inner {
            width: 82px;
            height: 82px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, #faf6ee 0%, #ebe0cd 80%, #caa486 100%);
            border: 1px solid rgba(180, 160, 135, 0.45);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 
                inset 0 3px 6px rgba(0, 0, 0, 0.25),
                0 1px 2px rgba(255, 255, 255, 0.8);
        }

        .monogram-sm {
            font-family: 'Great Vibes', cursive;
            font-size: 42px;
            color: #6b5840;
            text-shadow: 
                1px 1px 0px rgba(255, 255, 255, 0.9),
                -1px -1px 1px rgba(0, 0, 0, 0.3);
            letter-spacing: -2px;
            user-select: none;
            margin-top: -4px;
        }
    </style>
</head>
<body>

    <div class="viewport">
        
        <!-- BURGUNDY ENVELOPE -->
        <div class="envelope-container" id="envelope">
            <div class="paper-grain"></div>
            <div class="damask-pattern"></div>

            <!-- TOP SCALLOPED FLAP -->
            <div class="flap-svg flap-top-container">
                <svg width="100%" height="100%" viewBox="0 0 400 800" preserveAspectRatio="none">
                    <defs>
                        <linearGradient id="topGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#611321"/>
                            <stop offset="100%" stop-color="#360710"/>
                        </linearGradient>
                        <filter id="shadowTop" x="-10%" y="-10%" width="120%" height="130%">
                            <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
                        </filter>
                    </defs>
                    <path d="M 0,0 L 400,0 L 400,280 C 350,330 300,320 270,360 C 240,400 220,430 200,430 C 180,430 160,400 130,360 C 100,320 50,330 0,280 Z" 
                          fill="url(#topGradient)" filter="url(#shadowTop)"/>
                </svg>
            </div>

            <!-- BOTTOM SCALLOPED FLAP -->
            <div class="flap-svg flap-bottom-container">
                <svg width="100%" height="100%" viewBox="0 0 400 800" preserveAspectRatio="none">
                    <defs>
                        <linearGradient id="bottomGradient" x1="0%" y1="100%" x2="0%" y2="0%">
                            <stop offset="0%" stop-color="#611321"/>
                            <stop offset="100%" stop-color="#2a050b"/>
                        </linearGradient>
                        <filter id="shadowBottom" x="-10%" y="-30%" width="120%" height="130%">
                            <feDropShadow dx="0" dy="-8" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
                        </filter>
                    </defs>
                    <path d="M 0,800 L 400,800 L 400,520 C 350,470 300,480 270,440 C 240,400 220,370 200,370 C 180,370 160,400 130,440 C 100,480 50,470 0,520 Z" 
                          fill="url(#bottomGradient)" filter="url(#shadowBottom)"/>
                </svg>
            </div>

            <!-- WAX SEAL -->
            <div class="wax-seal" onclick="openEnvelope()">
                <div class="wax-seal-inner">
                    <span class="monogram-sm">SM</span>
                </div>
            </div>
        </div>

        <!-- CARD INSIDE (REVEALED ON CLICK) -->
        <div class="card-content">
            <h2>STEP 1 COMPLETE</h2>
            <p style="margin-top: 10px; font-size: 13px; color: #7a323c; font-family: sans-serif;">Ready for Step 2!</p>
        </div>

    </div>

    <script>
        function openEnvelope() {
            document.getElementById('envelope').classList.add('open');
        }
    </script>
</body>
</html>

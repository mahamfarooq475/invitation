<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burgundy Gold Damask Envelope - SM Monogram</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050304;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Cinzel', serif;
            overflow: hidden;
        }

        .viewport {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 800px;
            position: relative;
            background-color: #f7f3ed;
            overflow: hidden;
            box-shadow: 0 35px 80px rgba(0, 0, 0, 0.95);
            border-radius: 14px;
        }

        /* CARD CONTENT BELOW */
        .card-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            color: #4a0e17;
            background: radial-gradient(circle at center, #fffefb 0%, #f3ece1 100%);
        }

        .card-content h2 {
            font-size: 26px;
            letter-spacing: 3px;
            font-weight: 700;
        }

        /* ENVELOPE CONTAINER */
        .envelope-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #3b0a12;
            z-index: 10;
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.8s ease;
            perspective: 1000px;
        }

        .envelope-container.open {
            transform: scale(1.08);
            opacity: 0;
            pointer-events: none;
        }

        /* REALISTIC PAPER GRAIN OVERLAY */
        .paper-grain {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 8;
            pointer-events: none;
            opacity: 0.22;
            background-image: radial-gradient(#ffffff 0.8px, transparent 0.8px), radial-gradient(#000000 0.8px, transparent 0.8px);
            background-size: 4px 4px;
            background-position: 0 0, 2px 2px;
            mix-blend-mode: overlay;
        }

        /* ORNATE EMBOSSED DAMASK PATTERN */
        .damask-pattern {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 2;
            opacity: 0.35;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80"><g fill="%23d4af37" fill-opacity="0.8"><path d="M40 0 C30 15, 15 20, 15 35 C15 50, 30 50, 40 70 C50 50, 65 50, 65 35 C65 20, 50 15, 40 0 Z M40 20 C45 27, 52 28, 52 35 C52 42, 44 42, 40 55 C36 42, 28 42, 28 35 C28 28, 35 27, 40 20 Z"/><circle cx="40" cy="35" r="4"/></g></svg>');
            background-size: 80px 80px;
            filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.9)) drop-shadow(-1px -1px 0.5px rgba(255,215,0,0.3));
        }

        /* 4 OVERLAPPING ENVELOPE FLAPS */
        .flap {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #4a0d18;
            transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .flap-top {
            z-index: 5;
            clip-path: polygon(0 0, 100% 0, 50% 50%);
            background: linear-gradient(180deg, #611321 0%, #360710 100%);
            filter: drop-shadow(0px 10px 15px rgba(0, 0, 0, 0.8));
            transform-origin: top;
        }

        .flap-bottom {
            z-index: 4;
            clip-path: polygon(0 100%, 100% 100%, 50% 48%);
            background: linear-gradient(0deg, #611321 0%, #30050c 100%);
            filter: drop-shadow(0px -8px 12px rgba(0, 0, 0, 0.7));
            transform-origin: bottom;
        }

        .flap-left {
            z-index: 3;
            clip-path: polygon(0 0, 0 100%, 50% 50%);
            background: linear-gradient(90deg, #500d19 0%, #2e050b 100%);
        }

        .flap-right {
            z-index: 3;
            clip-path: polygon(100% 0, 100% 100%, 50% 50%);
            background: linear-gradient(-90deg, #500d19 0%, #2e050b 100%);
        }

        .envelope-container.open .flap-top {
            transform: rotateX(160deg);
        }

        .envelope-container.open .flap-bottom {
            transform: rotateX(-160deg);
        }

        /* ORGANIC CREAM WAX SEAL WITH "SM" MONOGRAM */
        .wax-seal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 110px;
            height: 110px;
            background: radial-gradient(circle at 35% 30%, #ffffff 0%, #f7f1e3 40%, #e2d3bb 75%, #b29e80 100%);
            border-radius: 45% 55% 48% 52% / 53% 47% 53% 47%;
            box-shadow: 
                0 14px 30px rgba(0, 0, 0, 0.85),
                inset 0 4px 6px rgba(255, 255, 255, 1),
                inset 0 -5px 8px rgba(100, 85, 65, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 20;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .wax-seal:hover {
            transform: translate(-50%, -50%) scale(1.05);
            box-shadow: 0 18px 36px rgba(0, 0, 0, 0.95);
        }

        .wax-seal-inner {
            width: 82px;
            height: 82px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, #faf6ee 0%, #ebe0cd 80%, #caa486 100%);
            border: 1px solid rgba(180, 160, 135, 0.45);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 
                inset 0 3px 6px rgba(0, 0, 0, 0.25),
                0 1px 2px rgba(255, 255, 255, 0.8);
            position: relative;
        }

        /* STYLED "SM" MONOGRAM */
        .monogram-sm {
            font-family: 'Great Vibes', cursive;
            font-size: 42px;
            color: #6b5840;
            text-shadow: 
                1px 1px 0px rgba(255, 255, 255, 0.9),
                -1px -1px 1px rgba(0, 0, 0, 0.3);
            letter-spacing: -2px;
            user-select: none;
            margin-top: -4px;
        }
    </style>
</head>
<body>

    <div class="viewport">
        <!-- CARD INSIDE -->
        <div class="card-content">
            <h2>STEP 1 COMPLETE</h2>
            <p style="margin-top: 10px; font-size: 13px; color: #7a323c; font-family: sans-serif;">Ready for Step 2!</p>
        </div>

        <!-- BURGUNDY ENVELOPE -->
        <div class="envelope-container" id="envelope">
            <div class="paper-grain"></div>
            <div class="damask-pattern"></div>

            <!-- FLAPS -->
            <div class="flap flap-left"></div>
            <div class="flap flap-right"></div>
            <div class="flap flap-bottom"></div>
            <div class="flap flap-top"></div>

            <!-- WAX SEAL WITH "SM" -->
            <div class="wax-seal" onclick="openEnvelope()">
                <div class="wax-seal-inner">
                    <span class="monogram-sm">SM</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function openEnvelope() {
            document.getElementById('envelope').classList.add('open');
        }
    </script>
</body>
</html>

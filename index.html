<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burgundy Damask Swan Envelope</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0c0809;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Georgia', serif;
            overflow: hidden;
        }

        .viewport {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 800px;
            position: relative;
            background-color: #f7f3ed;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            border-radius: 14px;
        }

        /* ENVELOPE BASE */
        .envelope-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #4a0e17;
            z-index: 10;
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.8s ease;
        }

        .envelope-container.open {
            transform: scale(1.08);
            opacity: 0;
            pointer-events: none;
        }

        /* PAPER TEXTURE & EMBOSSED DAMASK PATTERN */
        .damask-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
            opacity: 0.15;
            background-image: radial-gradient(#fff 0.75px, transparent 0.75px), radial-gradient(#000 0.75px, transparent 0.75px);
            background-size: 8px 8px;
            background-position: 0 0, 4px 4px;
            mix-blend-mode: overlay;
        }

        /* SCALLOPED FLAPS OVERLAY */
        .flap-top, .flap-bottom {
            position: absolute;
            width: 100%;
            height: 50%;
            background-color: #420b13;
            pointer-events: none;
            z-index: 2;
            transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .flap-top {
            top: 0;
            clip-path: polygon(0 0, 100% 0, 100% 70%, 50% 100%, 0 70%);
            filter: drop-shadow(0px 6px 10px rgba(0, 0, 0, 0.6));
            background: linear-gradient(180deg, #57121c 0%, #3d0a11 100%);
        }

        .flap-bottom {
            bottom: 0;
            clip-path: polygon(0 30%, 50% 0, 100% 30%, 100% 100%, 0 100%);
            filter: drop-shadow(0px -6px 10px rgba(0, 0, 0, 0.6));
            background: linear-gradient(0deg, #57121c 0%, #3d0a11 100%);
        }

        .envelope-container.open .flap-top {
            transform: translateY(-100%);
        }

        .envelope-container.open .flap-bottom {
            transform: translateY(100%);
        }

        /* CREAM SWAN WAX SEAL */
        .wax-seal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 95px;
            height: 95px;
            background: radial-gradient(circle at 35% 35%, #fffef8 0%, #f3eee3 50%, #dfd5c2 85%, #b8ab94 100%);
            border-radius: 48% 52% 50% 50% / 52% 48% 52% 48%; /* Organic wax edge shape */
            box-shadow: 
                0 10px 22px rgba(0, 0, 0, 0.6),
                inset 0 3px 5px rgba(255, 255, 255, 0.9),
                inset 0 -4px 6px rgba(120, 100, 80, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 20;
            border: 1px solid #e8e2d5;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .wax-seal:hover {
            transform: translate(-50%, -50%) scale(1.05);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.7);
        }

        .wax-seal-inner {
            width: 74px;
            height: 74px;
            border-radius: 50%;
            border: 1px solid rgba(160, 140, 120, 0.25);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.08);
        }

        .seal-swan {
            width: 48px;
            height: 48px;
            fill: #7d6e5a;
            filter: drop-shadow(1px 1px 0px rgba(255, 255, 255, 0.8));
        }

        /* CARD CONTENT BELOW */
        .card-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            color: #4a0e17;
        }

        .card-content h2 {
            font-size: 24px;
            letter-spacing: 2px;
            font-weight: 400;
        }
    </style>
</head>
<body>

    <div class="viewport">
        <!-- CARD CONTENT HIDDEN BEHIND ENVELOPE -->
        <div class="card-content">
            <h2>BURGUNDY SWAN CARD</h2>
            <p style="margin-top: 10px; font-size: 14px; color: #7a323c;">Ready for Step 2!</p>
        </div>

        <!-- BURGUNDY ENVELOPE -->
        <div class="envelope-container" id="envelope">
            <div class="damask-pattern"></div>

            <div class="flap-top"></div>
            <div class="flap-bottom"></div>

            <!-- CREAM SWAN WAX SEAL -->
            <div class="wax-seal" onclick="openEnvelope()">
                <div class="wax-seal-inner">
                    <svg class="seal-swan" viewBox="0 0 24 24">
                        <!-- Swan Motif -->
                        <path d="M18.5 12c-.83 0-1.5.67-1.5 1.5 0 .63.39 1.17.95 1.38-.28.87-1.1 1.62-2.45 1.62-1.34 0-2.5-.89-2.5-2.5 0-2.8 3.5-3.8 3.5-7 0-2.21-1.79-4-4-4-1.8 0-3.32 1.19-3.82 2.83C8.16 5.3 7.15 5 6 5c-2.21 0-4 1.79-4 4 0 2.8 3.5 3.8 3.5 7 0 2.76 2.24 5 5 5 2.88 0 4.88-1.75 5.58-3.23.68.15 1.28.23 1.92.23 2.76 0 5-2.24 5-5 0-.83-.67-1.5-1.5-1.5z"/>
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <script>
        function openEnvelope() {
            document.getElementById('envelope').classList.add('open');
        }
    </script>
</body>
</html>

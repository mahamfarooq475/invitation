<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burgundy Scalloped Lace Floral Envelope</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #060405;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Cinzel', serif;
            overflow: hidden;
        }

        .viewport {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 800px;
            position: relative;
            background-color: #f7f3ed;
            overflow: hidden;
            box-shadow: 0 35px 80px rgba(0, 0, 0, 0.95);
            border-radius: 14px;
        }

        /* REVEALED INNER CARD */
        .card-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            color: #4a0d18;
            background: radial-gradient(circle at center, #fffefb 0%, #f3ece1 100%);
            transform: scale(0.95) translateY(20px);
            opacity: 0;
            transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1), opacity 1s ease 0.3s;
        }

        .envelope-container.open ~ .card-content {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        .card-content h2 {
            font-size: 26px;
            letter-spacing: 3px;
            font-weight: 700;
        }

        /* ENVELOPE BASE CONTAINER WITH SEAMLESS FLORAL PATTERN */
        .envelope-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #3b0911;
            z-index: 10;
            perspective: 1200px;
            pointer-events: auto;
            transition: opacity 0.8s ease 0.6s, visibility 0.8s ease 0.6s;
        }

        .envelope-container.open {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* OVERLAPPING FLAPS */
        .flap-svg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            transition: transform 1.1s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
        }

        .flap-left-container {
            z-index: 5;
            transform-origin: left center;
        }

        .flap-right-container {
            z-index: 4;
            transform-origin: right center;
        }

        .envelope-container.open .flap-left-container {
            transform: rotateY(-160deg);
        }

        .envelope-container.open .flap-right-container {
            transform: rotateY(160deg);
        }

        /* CREAM WAX SEAL WITH "SM" MONOGRAM */
        .wax-seal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 110px;
            height: 110px;
            background: radial-gradient(circle at 35% 30%, #ffffff 0%, #f7f1e3 40%, #e2d3bb 75%, #b29e80 100%);
            border-radius: 45% 55% 48% 52% / 53% 47% 53% 47%;
            box-shadow: 
                0 14px 30px rgba(0, 0, 0, 0.85),
                inset 0 4px 6px rgba(255, 255, 255, 1),
                inset 0 -5px 8px rgba(100, 85, 65, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 20;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease;
            will-change: transform, opacity;
        }

        .wax-seal:hover {
            transform: translate(-50%, -50%) scale(1.06);
            box-shadow: 0 18px 36px rgba(0, 0, 0, 0.95);
        }

        .envelope-container.open .wax-seal {
            transform: translate(-50%, -50%) scale(0.6);
            opacity: 0;
        }

        .wax-seal-inner {
            width: 82px;
            height: 82px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, #faf6ee 0%, #ebe0cd 80%, #caa486 100%);
            border: 1px solid rgba(180, 160, 135, 0.45);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 
                inset 0 3px 6px rgba(0, 0, 0, 0.25),
                0 1px 2px rgba(255, 255, 255, 0.8);
        }

        .monogram-sm {
            font-family: 'Great Vibes', cursive;
            font-size: 42px;
            color: #6b5840;
            text-shadow: 
                1px 1px 0px rgba(255, 255, 255, 0.9),
                -1px -1px 1px rgba(0, 0, 0, 0.3);
            letter-spacing: -2px;
            user-select: none;
            margin-top: -4px;
        }
    </style>
</head>
<body>

    <div class="viewport">
        
        <!-- BURGUNDY ENVELOPE -->
        <div class="envelope-container" id="envelope">

            <!-- REUSABLE SVG EMBOSSED FLORAL PATTERNS & FILTERS -->
            <svg style="display: none;">
                <defs>
                    <!-- Real 3D Blind Embossing Filter -->
                    <filter id="blindEmboss" x="-20%" y="-20%" width="140%" height="140%">
                        <feDropShadow dx="1" dy="1.5" stdDeviation="0.8" flood-color="#5c1220" flood-opacity="0.9"/>
                        <feDropShadow dx="-1" dy="-1" stdDeviation="0.8" flood-color="#1f0307" flood-opacity="0.9"/>
                    </filter>

                    <!-- Full Floral Brocade Motif -->
                    <g id="floral-brocade" filter="url(#blindEmboss)">
                        <!-- Main Blooming Flower -->
                        <path d="M 50,50 C 40,30 60,20 70,35 C 80,20 100,30 90,50 C 105,60 95,80 75,75 C 65,90 45,80 50,60 C 35,50 40,35 50,50 Z" fill="#4a0c16"/>
                        <circle cx="70" cy="52" r="8" fill="#30060d"/>
                        <!-- Surrounding Leaves & Buds -->
                        <path d="M 70,20 Q 80,0 90,10 Q 80,25 70,20 Z" fill="#420a13"/>
                        <path d="M 95,40 Q 115,35 110,50 Q 95,50 95,40 Z" fill="#420a13"/>
                        <path d="M 80,75 Q 90,95 75,100 Q 70,85 80,75 Z" fill="#420a13"/>
                        <path d="M 45,65 Q 25,75 30,60 Q 45,55 45,65 Z" fill="#420a13"/>
                        <!-- Dotted Stems -->
                        <path d="M 70,100 Q 60,140 85,180" stroke="#4d0d18" stroke-width="2" stroke-dasharray="2 3" fill="none"/>
                        <circle cx="85" cy="180" r="3" fill="#4d0d18"/>
                    </g>

                    <!-- Laser Cut Scalloped Border Hole-Punch Pattern -->
                    <pattern id="scallopPunch" width="12" height="12" patternUnits="userSpaceOnUse">
                        <circle cx="6" cy="6" r="2" fill="#000" opacity="0.4"/>
                    </pattern>
                </defs>
            </svg>

            <!-- LEFT SCALLOPED FLAP WITH FULL FLORAL EMBOSSING -->
            <div class="flap-svg flap-left-container">
                <svg width="100%" height="100%" viewBox="0 0 400 800" preserveAspectRatio="none">
                    <defs>
                        <linearGradient id="leftGradBurgundy" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#4d0c17"/>
                            <stop offset="100%" stop-color="#2d050c"/>
                        </linearGradient>
                        <filter id="shadowLeft" x="-10%" y="-10%" width="130%" height="120%">
                            <feDropShadow dx="8" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.8"/>
                        </filter>
                    </defs>

                    <!-- Laser Cut Scalloped Curved Flap Path -->
                    <path d="M 0,0 
                             C 80,80 120,120 160,200 
                             C 180,240 210,320 230,400 
                             C 210,480 180,560 160,600 
                             C 120,680 80,720 0,800 Z" 
                          fill="url(#leftGradBurgundy)" filter="url(#shadowLeft)"/>

                    <!-- Laser-Cut Eyelet Hole Border along Scallop Curve -->
                    <path d="M 0,0 C 80,80 120,120 160,200 C 180,240 210,320 230,400 C 210,480 180,560 160,600 C 120,680 80,720 0,800" 
                          stroke="#210307" stroke-width="6" stroke-dasharray="3 6" fill="none" opacity="0.6"/>

                    <!-- Full Floral Brocade Sprigs on Left Flap -->
                    <use href="#floral-brocade" x="-10" y="20" transform="scale(1.1)"/>
                    <use href="#floral-brocade" x="20" y="280" transform="scale(1.2) rotate(-10)"/>
                    <use href="#floral-brocade" x="-15" y="520" transform="scale(1) rotate(15)"/>
                </svg>
            </div>

            <!-- RIGHT SCALLOPED FLAP WITH FULL FLORAL EMBOSSING -->
            <div class="flap-svg flap-right-container">
                <svg width="100%" height="100%" viewBox="0 0 400 800" preserveAspectRatio="none">
                    <defs>
                        <linearGradient id="rightGradBurgundy" x1="100%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#470a14"/>
                            <stop offset="100%" stop-color="#28040a"/>
                        </linearGradient>
                        <filter id="shadowRight" x="-20%" y="-10%" width="130%" height="120%">
                            <feDropShadow dx="-8" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.8"/>
                        </filter>
                    </defs>

                    <!-- Laser Cut Scalloped Curved Flap Path -->
                    <path d="M 400,0 
                             C 320,80 280,120 240,200 
                             C 220,240 190,320 170,400 
                             C 190,480 220,560 240,600 
                             C 280,680 320,720 400,800 Z" 
                          fill="url(#rightGradBurgundy)" filter="url(#shadowRight)"/>

                    <!-- Laser-Cut Eyelet Hole Border along Scallop Curve -->
                    <path d="M 400,0 C 320,80 280,120 240,200 C 220,240 190,320 170,400 C 190,480 220,560 240,600 C 280,680 320,720 400,800" 
                          stroke="#210307" stroke-width="6" stroke-dasharray="3 6" fill="none" opacity="0.6"/>

                    <!-- Full Floral Brocade Sprigs on Right Flap -->
                    <use href="#floral-brocade" x="180" y="40" transform="scale(-1.1, 1.1) translate(-350, 0)"/>
                    <use href="#floral-brocade" x="150" y="300" transform="scale(-1.2, 1.2) translate(-320, 0) rotate(10)"/>
                    <use href="#floral-brocade" x="170" y="540" transform="scale(-1, 1) translate(-350, 0) rotate(-15)"/>
                </svg>
            </div>

            <!-- CREAM WAX SEAL WITH "SM" MONOGRAM -->
            <div class="wax-seal" onclick="openEnvelope()">
                <div class="wax-seal-inner">
                    <span class="monogram-sm">SM</span>
                </div>
            </div>
        </div>

        <!-- REVEALED CARD -->
        <div class="card-content">
            <h2>STEP 1 COMPLETE</h2>
            <p style="margin-top: 10px; font-size: 13px; color: #4a0d18; font-family: sans-serif;">Ready for Step 2!</p>
        </div>

    </div>

    <script>
        function openEnvelope() {
            document.getElementById('envelope').classList.add('open');
        }
    </script>
</body>
</html>
